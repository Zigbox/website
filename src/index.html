<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbox</title>
<meta name="description" content="Zigbox, a rootless, daemonless Linux container runtime, and Zigcube, its orchestrator.">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--fg:#1d1b16;--muted:#6a6558;--line:#e2ded2;--accent:#9a5800;
--display:"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--surface:#1d1c17;--fg:#ece8dc;--muted:#a39d8c;--line:#2e2c25;--accent:#f2b13c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140f;--surface:#1d1c17;--fg:#ece8dc;--muted:#a39d8c;--line:#2e2c25;--accent:#f2b13c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.55;margin:0}
main{max-width:44rem;margin:0 auto;padding:3rem 16px}
h1{font-size:clamp(2rem,6vw,2.8rem);margin:0 0 .5rem;line-height:1.1}
h2{font-size:1.1rem;margin:2rem 0 .5rem}
p{margin:.5rem 0} a{color:var(--accent)} a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{padding-left:1.2rem} code{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Zigbox</h1>
<p>A rootless, daemonless Linux container runtime, image store and builder, written in Zig, and Zigcube, the orchestrator for its workloads.</p>

<ul>
<li><a href="/zigbox/">Zigbox</a>: status and milestones (<a href="https://github.com/Zigbox/zigbox">source</a>)</li>

</ul>
<h2>Reference</h2>
<ul>

</ul>
</main>
</body>
</html>
